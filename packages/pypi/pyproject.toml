[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deplatch"
version = "0.1.0"
description = "Check dependencies before you trust them. Blocks AI-hallucinated and look-alike PyPI/npm packages before install, in your terminal, your AI agent, and CI."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdul Hadi" }]
keywords = ["security", "supply-chain", "slopsquatting", "typosquatting", "dependencies", "ai-agents", "kiro", "pypi", "npm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/deplatch/deplatch"
Issues = "https://github.com/deplatch/deplatch/issues"

[project.scripts]
deplatch = "deplatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
