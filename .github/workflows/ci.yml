name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Regenerate ESM files
        run: node scripts/gen-esm.js --check
      - run: npm test --prefix packages/npm
      - run: python -m unittest discover -s tests
        working-directory: packages/pypi
        env: { PYTHONPATH: src }
      - name: DepLatch checks its own manifests
        run: node packages/npm/bin/deplatch.js scan packages/npm
